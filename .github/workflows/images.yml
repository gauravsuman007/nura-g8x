# Build flashable Nura images for the LG G8x (boot.img + userdata image) with
# pmbootstrap, from the packages in pmaports/device/testing. No vendor
# firmware is included: nura-firmware-loader copies it from the phone's own
# partitions on first boot. See IMAGES.md.
name: images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ui:
        description: "pmbootstrap UI"
        default: "gnome-mobile"

permissions:
  contents: write

      - name: Save ccache, distfiles and apk downloads
        # always: a failed later step must not throw away a 50 minute kernel compile
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.WORK }}/cache_ccache_aarch64
            ${{ env.WORK }}/cache_distfiles
            ${{ env.WORK }}/cache_http
            ${{ env.WORK }}/cache_apk_aarch64
          key: pmb-${{ runner.arch }}-${{ github.run_id }}

  pages: write
  id-token: write

env:
  PMB_TAG: "3.12.1"
  PMB: python3 ${{ github.workspace }}/../pmbootstrap/pmbootstrap.py
  # absolute, without "..": actions/cache rejects relative parent paths (the
  # first run silently saved no cache at all)
  WORK: /home/runner/pmb-work
  APORTS: ${{ github.workspace }}/../pmaports
  # Default login for release images; change it on first boot (passwd).
  IMAGE_PASSWORD: "147147"

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 340
    outputs:
      publish: ${{ steps.key.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/share/boost || true
          df -h /

      - name: Get pmbootstrap and pmaports
        run: |
          git clone -q --depth 1 --branch "$PMB_TAG" https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git ../pmbootstrap
          git clone -q --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git ../pmaports
          for p in device-lg-mh2lm linux-nura-lg-mh2lm nura-g8x-tweaks; do
            rm -rf "$APORTS/device/testing/$p"
            cp -r "pmaports/device/testing/$p" "$APORTS/device/testing/"
          done
          python3 pmaports/patch-libcamera.py "$APORTS" pmaports
          grep -n "nura\|^pkgrel" "$APORTS/temp/libcamera/APKBUILD"
          git -C "$APORTS" -c user.email=ci@local -c user.name=ci add -A
          git -C "$APORTS" -c user.email=ci@local -c user.name=ci commit -qm "nura-g8x packages"

      - name: Configure pmbootstrap
        run: |
          mkdir -p ~/.config "$WORK"
          cat > ~/.config/pmbootstrap_v3.cfg <<EOF
          [pmbootstrap]
          aports = $APORTS
          device = lg-mh2lm
          ui = ${{ github.event.inputs.ui || 'gnome-mobile' }}
          user = user
          work = $WORK
          hostname = lg-g8x
          ssh_keys = False
          ccache_size = 8G
          extra_packages = bluez,bluez-systemd,modemmanager,modemmanager-systemd,alsa-utils,libcamera-tools,v4l-utils,evtest,iw,usbutils,i2c-tools,mesa-utils,glmark2,gstreamer-tools,gst-plugins-good,gst-plugins-bad,gst-libav,calls,chatty,snapshot,loupe,showtime,decibels,papers,nautilus,gnome-text-editor,gnome-calculator,firefox-esr,mobile-config-firefox,htop,lsof,zstd,gnome-screenshot,bluez-btmgmt,libgpiod,mesa-rusticl
          [providers]
          EOF
          printf 8 > "$WORK/version"
          $PMB --version

      - name: Restore ccache, distfiles and apk downloads
        id: pmbcache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.WORK }}/cache_ccache_aarch64
            ${{ env.WORK }}/cache_distfiles
            ${{ env.WORK }}/cache_http
            ${{ env.WORK }}/cache_apk_aarch64
          key: pmb-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: pmb-${{ runner.arch }}-

      - name: Give the restored build caches to the chroot user
        # actions/cache restores as the runner user; pmbootstrap builds as
        # uid 12345 (pmos) inside its chroot ("ccache: Permission denied")
        run: |
          mkdir -p "$WORK/cache_ccache_aarch64" "$WORK/cache_distfiles"
          sudo chown -R 12345:12345 "$WORK/cache_ccache_aarch64" "$WORK/cache_distfiles"

      - name: Package signing key
        id: key
        # Stable key (repo secret APK_SIGNING_KEY; public half shipped in device-lg-mh2lm as
        # /etc/apk/keys/nura-g8x-2026.rsa.pub) so phones can update from the published
        # repository. Without the secret pmbootstrap makes a throwaway key and nothing is published.
        env:
          KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            mkdir -p "$WORK/config_abuild"
            printf '%s\n' "$KEY" > "$WORK/config_abuild/nura-g8x-2026.rsa"
            cp pmaports/device/testing/device-lg-mh2lm/nura-g8x-2026.rsa.pub "$WORK/config_abuild/"
            # apk inside the build chroots must trust it too, or indexing fails "UNTRUSTED signature"
            mkdir -p "$WORK/config_apk_keys"
            cp pmaports/device/testing/device-lg-mh2lm/nura-g8x-2026.rsa.pub "$WORK/config_apk_keys/"
            printf 'PACKAGER_PRIVKEY="/home/pmos/.abuild/nura-g8x-2026.rsa"\n' > "$WORK/config_abuild/abuild.conf"
            chmod 600 "$WORK/config_abuild/nura-g8x-2026.rsa"
            sudo chown -R 12345:12345 "$WORK/config_abuild"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APK_SIGNING_KEY secret missing: packages signed with a throwaway key, repository not published"
          fi

      - name: Build kernel
        run: $PMB -y build --arch aarch64 linux-nura-lg-mh2lm

      - name: Build patched libcamera
        # before the tweaks package: it depends on libcamera>=...-r100 and pmbootstrap resolves
        # dependencies before building anything
        run: $PMB -y build --arch aarch64 libcamera

      - name: Build device and tweaks packages
        run: $PMB -y build --arch aarch64 device-lg-mh2lm nura-g8x-tweaks

      - name: Install rootfs
        run: $PMB -y install --password "$IMAGE_PASSWORD"

      - name: Export images
        run: |
          mkdir -p out
          $PMB export out
          ls -lL out
          sudo cp -L out/boot.img dist-boot.img
          sudo cp -L out/lg-mh2lm.img dist-userdata.img
          sudo chown "$(id -u):$(id -g)" dist-boot.img dist-userdata.img
          mkdir -p dist
          mv dist-boot.img dist/nura-lg-mh2lm-boot.img
          xz -T0 -6 -c dist-userdata.img > dist/nura-lg-mh2lm-userdata.img.xz
          rm dist-userdata.img
          sudo cp $WORK/packages/*/aarch64/{linux-nura-lg-mh2lm,device-lg-mh2lm,nura-g8x-tweaks}-*.apk dist/ 2>/dev/null || true
          sudo cp $WORK/config_abuild/*.rsa.pub dist/nura-ci.rsa.pub 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" dist; (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist

      - name: Build package repository
        if: steps.key.outputs.publish == 'true'
        run: |
          mkdir -p site/repo/aarch64
          sudo cp -L $WORK/packages/*/aarch64/*.apk $WORK/packages/*/aarch64/APKINDEX.tar.gz site/repo/aarch64/
          sudo chown -R "$(id -u):$(id -g)" site
          cp pmaports/device/testing/device-lg-mh2lm/nura-g8x-2026.rsa.pub site/
          # the index must be signed with the published key
          tar -tzf site/repo/aarch64/APKINDEX.tar.gz | grep -q 'SIGN.RSA.nura-g8x-2026.rsa.pub' \
            || { echo "APKINDEX not signed with nura-g8x-2026"; tar -tzf site/repo/aarch64/APKINDEX.tar.gz | head; exit 1; }
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Nura G8x package repository</title>
          <h1>Nura LG G8x packages</h1>
          <p>apk repository for the Nura images (kernel, device, tweaks, patched libcamera).
          Images already include the key and repository entry; update with <code>sudo apk update &amp;&amp; sudo apk upgrade</code>.
          Manual setup: copy <a href="nura-g8x-2026.rsa.pub">nura-g8x-2026.rsa.pub</a> to <code>/etc/apk/keys/</code> and add
          <code>https://gauravsuman007.github.io/nura-g8x/repo</code> to <code>/etc/apk/repositories</code>.</p>
          HTML
          ls -l site/repo/aarch64

      - uses: actions/upload-pages-artifact@v3
        if: steps.key.outputs.publish == 'true'
        with:
          path: site

      - name: ccache statistics
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" $WORK/cache_* 2>/dev/null || true
          du -sh $WORK/cache_* 2>/dev/null || true

      - name: Show pmbootstrap log on failure
        if: failure()
        run: tail -n 300 "$WORK/log.txt" || true

      - uses: actions/upload-artifact@v4
        with:
          name: nura-lg-mh2lm-images
          path: dist/
          retention-days: 14

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Nura LG G8x $GITHUB_REF_NAME" --notes-file release/README.md
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  pages:
    needs: image
    if: needs.image.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
