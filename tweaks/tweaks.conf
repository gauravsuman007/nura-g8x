# LG G8x Tweaks (nura-g8x-tweaks). Edit with the "LG G8x Tweaks" app, or by
# hand followed by: sudo nura-tweaks-helper apply
# 1 = on, 0 = off.

# Buttons (the power button is broken on many G8x)
POWER_KEY=1          # Assistant key acts as the power button
POWER_HOLD_MS=300    # hold time before the Assistant key counts as power
RESET_COMBO=1        # hold Assistant + Volume Down to restart (in the kernel)
RESET_HOLD_MS=8000

# Wake and pocket
WAKE_KEYS=1          # Volume Up / Assistant wake the phone from suspend
TOUCH_GUARD=1        # touchscreen ignored while the screen is off
POCKET_GUARD=1       # volume keys ignored while the screen is off and covered

# Dock (USB-C DisplayPort)
DOCK_AUTO=1          # external monitor becomes the main desktop
DOCK_PANEL_OFF=1     # phone screen dark while docked
DOCK_POWER_KEY_OFF=1 # power key does nothing while docked (no suspend)
DOCK_STUCK_WARN=1    # notify when the dock stops responding
MONITOR_COLOR_PROFILE=0  # 1: let GNOME apply the EDID color profile to external monitors
DOCK_4K60=0          # 4 DisplayPort lanes (4K 60 Hz), dock USB drops to USB 2; next plug-in (experimental)

# Battery. CHARGE_LIMIT=1 turns on GNOME's "Preserve Battery Health" (UPower)
# with the thresholds below instead of GNOME's fixed 75/80.
CHARGE_LIMIT=1
CHARGE_LIMIT_START=75
CHARGE_LIMIT_END=80
CHARGE_HOLD=1        # at the limit, run from USB and leave the battery idle (0: run from battery)
CHARGE_CURRENT_MA=1950   # fast-charge current, 100-3000
CHARGE_VOLTAGE_MV=4400   # charge (float) voltage, 3900-4400; lower = longer battery life, less capacity

# Sensors
GYRO=1               # gyroscope as an input device (games, apps)
SENSOR_CHECK=1       # alert at boot if the sensor DSP did not start

# Standby
AUTO_SUSPEND_MIN=0   # suspend after this many idle minutes on battery, 0 = never (server use)
WIFI_STABLE_MAC=1    # one fixed Wi-Fi MAC per network instead of a random one per boot
