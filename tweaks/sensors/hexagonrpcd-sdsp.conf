[Service]
# LG G8x: hexagonrpcd 0.5.0 with two fixes (Alpine ships 0.4.0, which
# mis-handles the sensors PD) and LG's registry, configs and socinfo under -R.
Environment=LD_LIBRARY_PATH=/usr/lib/nura-g8x/lib
ExecStart=
ExecStart=/usr/lib/nura-g8x/bin/hexagonrpcd -f /dev/fastrpc-sdsp -d sdsp -s -R /usr/share/qcom/sm8150/LG/mh2lm
