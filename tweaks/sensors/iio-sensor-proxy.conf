[Unit]
# The SLPI sensors appear only after hexagonrpcd-sdsp has served the registry;
# without this iio-sensor-proxy starts first, finds nothing and exits for good.
After=hexagonrpcd-sdsp.service
Wants=hexagonrpcd-sdsp.service

[Service]
Restart=always
RestartSec=5
# libssc 0.4.4 with the proximity fix (any non-zero type is "near")
Environment=LD_LIBRARY_PATH=/usr/lib/nura-g8x/lib
