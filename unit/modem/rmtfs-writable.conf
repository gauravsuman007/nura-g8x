# The modem keeps its settings in EFS on modemst1/2, served by rmtfs.
# Upstream starts rmtfs with -r (writes kept in RAM only), so settings the
# modem is given at runtime are lost at every boot. nura-lge-modem turns the
# carrier profile auto-selection off, and that only takes effect when the
# modem starts, so it has to persist. Android lets the modem write EFS; do
# the same.
[Service]
ExecStart=
ExecStart=/usr/bin/rmtfs -P -s
