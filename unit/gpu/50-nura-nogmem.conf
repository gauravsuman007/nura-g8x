# Adreno 640 in GMEM (tiled) passes: the colour cache can read a 64 KiB block start below a render
# target that is unmapped, a GPU fault (source=CCU). The kernel's 64 KiB VA alignment removes most of
# them, but one still hit a camera app (lost GL context, app crash, DSI error burst, blank screen).
# Direct (sysmem) rendering avoids the path; glmark2 scores the same. Applies to the whole user
# session (GNOME Shell, wireplumber, apps). To switch it off: write "FD_MESA_DEBUG=" to
# /etc/environment.d/50-nura-nogmem.conf and log in again.
FD_MESA_DEBUG=nogmem
