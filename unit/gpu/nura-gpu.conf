# GNOME Shell on Adreno 640: in GMEM (tiled) passes the colour cache reads the
# 64 KiB-aligned block start below a render target; with 4 KiB-packed GPU
# addresses that page can be unmapped (GPU fault, source=CCU). Fixed in the
# kernel by extra-msm-va-align.py. Keep this drop-in only on kernels without
# that fix; remove it once the fixed kernel is flashed.
# Installed to /etc/systemd/user/org.gnome.Shell@.service.d/ ; next login.
[Service]
Environment=FD_MESA_DEBUG=nogmem
