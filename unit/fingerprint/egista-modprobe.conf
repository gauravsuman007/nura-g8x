# Fingerprint spot: LG's ready sequence with only the large bank-0x80 d3 gamma table (lhbm_skip=0x27fe). That table
# is needed for usable images and brightens/tints the whole panel during a capture; the other commands only add a
# flicker. Spot-only modes (lhbm_mode 1, 2, 4) are too dim.
options egista lhbm_mode=0 lhbm_skip=0x27fe
