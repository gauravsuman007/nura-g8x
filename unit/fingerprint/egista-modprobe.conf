# Fingerprint spot: lhbm_mode 0 (LG's full ready + on sequence) is the only mode that gives usable images; the
# ready part switches the whole panel to HBM gamma, so the GNOME Shell extension blacks out everything but the spot
# while the finger is down (as Android does). 1, 2 and 4 were tried and are too dim.
options egista lhbm_mode=0
