# Nura: camera names shown in GNOME Snapshot and other PipeWire apps.
# Install to /etc/wireplumber/wireplumber.conf.d/ and restart wireplumber.
monitor.libcamera.rules = [
  {
    matches = [ { node.name = "~libcamera_input.*cci_ac4a000_i2c-bus_0_camera_10" } ]
    actions = { update-props = { node.description = "Main Camera", node.nick = "Main", priority.session = 1100 } }
  }
  {
    matches = [ { node.name = "~libcamera_input.*cci_ac4a000_i2c-bus_1_camera_10" } ]
    actions = { update-props = { node.description = "Wide Camera", node.nick = "Wide", priority.session = 1000 } }
  }
  {
    matches = [ { node.name = "~libcamera_input.*cci_ac4b000_i2c-bus_0_camera_2d" } ]
    actions = { update-props = { node.description = "Front Camera", node.nick = "Front", priority.session = 900 } }
  }
]
