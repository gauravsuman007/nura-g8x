# Nura optional key helpers (for phones with a broken power button).
# 1 = on, 0 = off. Applied at boot by nura-keys.service; to apply now:
#   sudo systemctl restart nura-keys
#
# Assistant key acts as the power button (press: screen off/on, hold: power menu).
POWER_KEY=1
# Hold Assistant + Volume Down to restart the phone. Handled in the kernel,
# so it also works when the desktop has frozen.
RESET_COMBO=1
# How long the combo must be held, in milliseconds.
RESET_HOLD_MS=8000
# How long the Assistant key must be held before it counts as a power press,
# in milliseconds, so brushing the key does nothing.
POWER_HOLD_MS=300
