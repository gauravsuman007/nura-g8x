# LG G8x ThinQ
# Speakers: two CS35L41 amps on secondary MI2S (MultiMedia1, hw:N,0).
# 3.5 mm jack and microphones: WCD9340 over SLIMbus 0 (MultiMedia2, hw:N,1).
SectionVerb {
	EnableSequence [
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='L PCM Source' ASP"
		cset "name='R PCM Source' ASP"
		cset "name='SLIM RX0 MUX' ZERO"
		cset "name='SLIM RX1 MUX' ZERO"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
		cset "name='AIF1_CAP Mixer SLIM TX6' 1"
		cset "name='CDC_IF TX6 MUX' DEC6"
		cset "name='ADC MUX6' AMIC"
		cset "name='AMIC MUX6' ADC1"
		cset "name='ADC1 Volume' 10"
		cset "name='ADC2 Volume' 12"
		cset "name='RX1 Digital Volume' 80"
		cset "name='RX2 Digital Volume' 80"
	]
	DisableSequence [
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
		cset "name='AIF1_CAP Mixer SLIM TX6' 0"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"
	ConflictingDevice [
		"Headphones"
	]
	EnableSequence [
		cset "name='L Digital PCM Volume' 817"
		cset "name='R Digital PCM Volume' 817"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"
	EnableSequence [
		# Route SLIMbus RX only while headphones play: with RX0/RX1 muxed to
		# AIF1_PB all the time, SLIMbus capture (the microphone) gets zeros.
		cset "name='SLIM RX0 MUX' AIF1_PB"
		cset "name='SLIM RX1 MUX' AIF1_PB"
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia2' 1"
		cset "name='COMP1 Switch' 1"
		cset "name='COMP2 Switch' 1"
		cset "name='RX INT1_1 MIX1 INP0' RX0"
		cset "name='RX INT2_1 MIX1 INP0' RX1"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT2 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX HPH Mode' CLS_H_LOHIFI"
	]
	DisableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia2' 0"
		cset "name='SLIM RX0 MUX' ZERO"
		cset "name='SLIM RX1 MUX' ZERO"
		cset "name='RX INT1_1 MIX1 INP0' ZERO"
		cset "name='RX INT2_1 MIX1 INP0' ZERO"
		cset "name='RX HPH Mode' CLS_H_INVALID"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		JackControl "Headset Jack"
	}
}

SectionDevice."Mic" {
	Comment "Built-in microphone"
	ConflictingDevice [
		"Headset"
	]
	EnableSequence [
		cset "name='AMIC MUX6' ADC1"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}

SectionDevice."Headset" {
	Comment "Headset microphone"
	EnableSequence [
		cset "name='AMIC MUX6' ADC2"
	]
	DisableSequence [
		cset "name='AMIC MUX6' ADC1"
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		JackControl "Headset Jack"
	}
}
